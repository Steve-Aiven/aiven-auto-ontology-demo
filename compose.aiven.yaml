# Aiven Runtime Compose. Uses standard images Aiven recognizes for data services.
# Apps must use build: (Runtime does not deploy from image: alone).

services:
  os-embed-shim:
    build:
      context: ./apps/os-embed-shim
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USER: ${OPENSEARCH_USER:-avnadmin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_SSL_VERIFY: "false"
      OS_EMBED_MODEL_ID: ${OS_EMBED_MODEL_ID}
      OS_EMBED_DIMS: ${OS_EMBED_DIMS:-384}

  auto-ontology:
    build:
      context: ./vendor/nvidia-auto-ontology
      dockerfile: Dockerfile.aiven
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - os-embed-shim
      - ingestion-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-avnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-defaultdb}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      INGESTION_SERVICE_URL: http://ingestion-service:3002
      DEFAULT_MODELS_API_KEY: ${AIVEN_AI_GATEWAY_API_KEY}
      DEFAULT_MODELS_ENDPOINT: https://ai.aiven.io/v1
      DEFAULT_MODELS_MODEL: ${DEFAULT_MODELS_MODEL:-nemotron-nano-3-30b}
      REASONING_API_KEY: ${AIVEN_AI_GATEWAY_API_KEY}
      REASONING_ENDPOINT: https://ai.aiven.io/v1
      REASONING_MODEL: ${REASONING_MODEL:-nemotron-nano-3-30b}
      NON_REASONING_API_KEY: ${AIVEN_AI_GATEWAY_API_KEY}
      NON_REASONING_ENDPOINT: https://ai.aiven.io/v1
      NON_REASONING_MODEL: ${NON_REASONING_MODEL:-nemotron-nano-9b-v2}
      EMBED_API_KEY: unused
      EMBED_ENDPOINT: http://os-embed-shim:8080/v1
      EMBED_MODEL: os-embed
      CONNECTION_STRINGS: ${CONNECTION_STRINGS}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTO_ONTOLOGY_ADMIN_EMAIL: ${AUTO_ONTOLOGY_ADMIN_EMAIL}
      AUTO_ONTOLOGY_ADMIN_PASSWORD: ${AUTO_ONTOLOGY_ADMIN_PASSWORD}

  ingestion-service:
    build:
      context: ./vendor/nvidia-auto-ontology
      dockerfile: Dockerfile.aiven
    command: ["ingestion_service"]
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - os-embed-shim
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-avnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-defaultdb}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      EMBED_API_KEY: unused
      EMBED_ENDPOINT: http://os-embed-shim:8080/v1
      EMBED_MODEL: os-embed
      DEFAULT_MODELS_API_KEY: ${AIVEN_AI_GATEWAY_API_KEY}
      DEFAULT_MODELS_ENDPOINT: https://ai.aiven.io/v1
      DEFAULT_MODELS_MODEL: ${DEFAULT_MODELS_MODEL:-nemotron-nano-3-30b}
      CONNECTION_STRINGS: ${CONNECTION_STRINGS}

  auto-ontology-migrate:
    build:
      context: ./vendor/nvidia-auto-ontology
      dockerfile: Dockerfile.aiven
    command: ["migrate"]
    restart: "no"
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-avnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-defaultdb}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}

  frontend-migrate:
    build:
      context: ./vendor/nvidia-auto-ontology/frontend
      dockerfile: Dockerfile.aiven
      args:
        PYTHON_API_URL: http://auto-ontology:3001
    command: ["sh", "prisma/migrate.sh"]
    restart: "no"
    working_dir: /app/migrate
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-avnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-defaultdb}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTO_ONTOLOGY_ADMIN_EMAIL: ${AUTO_ONTOLOGY_ADMIN_EMAIL}
      AUTO_ONTOLOGY_ADMIN_PASSWORD: ${AUTO_ONTOLOGY_ADMIN_PASSWORD}
      APP_URL: ${APP_URL:-http://localhost:3000}

  auto-ontology-frontend:
    build:
      context: ./vendor/nvidia-auto-ontology/frontend
      dockerfile: Dockerfile.aiven
      args:
        PYTHON_API_URL: http://auto-ontology:3001
    ports:
      - "3000:3000"
    depends_on:
      - auto-ontology
      - postgres
    environment:
      PYTHON_API_URL: http://auto-ontology:3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-avnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-defaultdb}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTO_ONTOLOGY_ADMIN_EMAIL: ${AUTO_ONTOLOGY_ADMIN_EMAIL}
      AUTO_ONTOLOGY_ADMIN_PASSWORD: ${AUTO_ONTOLOGY_ADMIN_PASSWORD}
      AUTO_ONTOLOGY_MCP_PUBLIC_URL: ${AUTO_ONTOLOGY_MCP_PUBLIC_URL:-http://localhost:3003}

  auto-ontology-mcp:
    build:
      context: ./vendor/nvidia-auto-ontology/mcp
      dockerfile: Dockerfile.aiven
    ports:
      - "3003:3003"
    depends_on:
      - auto-ontology-frontend
    environment:
      AUTO_ONTOLOGY_MCP_PUBLIC_URL: ${AUTO_ONTOLOGY_MCP_PUBLIC_URL:-http://localhost:3003}
      APP_URL: ${APP_URL:-http://localhost:3000}

  # Aiven Runtime recognizes these standard images and provisions managed services.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:-defaultdb}

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
